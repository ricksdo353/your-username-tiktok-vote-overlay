<!doctype html>
<html lang="he">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TikTok LIVE Vote Overlay</title>
  <link rel="stylesheet" href="style.css?v=202611141627" />
</head>
<body>
  <div id="stage">
    <!-- background, identical to the promo video (bg=full, the default; bg=panel or bg=none for a camera stream) -->
    <div id="bgfx" class="abs">
      <div class="base"></div>
      <div class="grid"></div>
      <div class="glow glow-a"></div><div class="glow glow-b"></div>
      <div class="streaks"><div class="streak s1"></div><div class="streak s2"></div><div class="streak s3"></div></div>
      <div id="dots"></div>
      <div class="vignette"></div>
    </div>
    <div id="panel" class="abs"></div>

    <!-- live chat strip (decoration below TikTok's safe area) -->
    <div id="ticker" class="abs"><div id="tickerRow0" class="tk-row"></div><div id="tickerRow1" class="tk-row"></div></div>
    <div id="tickerFade" class="abs"></div>

    <div id="dash" class="abs">
      <!-- header: alternates between the round length and how to vote -->
      <div id="header" class="abs">
        <h1 id="question" class="abs he center hdr"><span class="grad">10 דקות</span> לכל סבב</h1>
        <h1 id="hint" class="abs he center hdr off">כתבו <span class="blue">1</span> או <span class="purple">2</span> <span class="grad">בלייב!</span></h1>
      </div>
      <div id="timer" class="abs pill hidden"><div id="timerRed" class="abs"></div><span id="timerText">10:00</span></div>

      <div id="cardA" class="abs portrait ring-a"><img id="imgA" alt="" /></div>
      <div id="cardB" class="abs portrait ring-b"><img id="imgB" alt="" /></div>
      <div id="nameA" class="abs name he blue">Player One</div>
      <div id="nameB" class="abs name he purple">Player Two</div>
      <div id="vs" class="abs vs">VS</div>

      <div id="bar" class="abs">
        <div id="barA" class="abs"></div>
        <div id="barFlashA" class="abs bar-flash"></div>
        <div id="barFlashB" class="abs bar-flash"></div>
        <span id="pctA" class="abs pct">50%</span>
        <span id="pctB" class="abs pct">50%</span>
      </div>

      <div id="scoreA" class="abs score">0</div>
      <div id="scoreB" class="abs score">0</div>

      <!-- gift rules sit in the event-pill slot while no event is showing -->
      <div id="giftTagA" class="abs gift-tag hidden"></div>
      <div id="giftTagB" class="abs gift-tag hidden"></div>
      <div id="thanks" class="abs he center hidden"></div>
      <div id="toast" class="abs he"></div>
      <div id="winner" class="abs he center hidden"><span id="winnerName"></span></div>
    </div>

    <!-- effects -->
    <div id="flyLayer" class="abs"></div>
    <div id="split" class="abs"><div class="half a"></div><div class="half b"></div></div>
    <div id="takeover" class="abs">
      <div id="tkVal" class="abs gold">+100</div>
      <img id="tkImg" class="abs" alt="" />
      <div id="tkName" class="abs he"></div>
    </div>
    <div id="dim" class="abs"></div>
    <div id="countdown" class="abs">3</div>
    <div id="feed" class="abs"></div>
    <div id="status" class="abs">offline</div>
  </div>

  <script src="lib/mqtt.min.js?v=202611141627"></script>
  <script src="speak.js?v=202611141627"></script>
  <script src="relay.js?v=202611141627"></script>
  <script src="script.js?v=202611141627"></script>
</body>
</html>
